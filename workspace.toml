# HomeCore workspace manifest
# Defines all repos, their roles, and their clone paths relative to this file.
# Used by workspace-clone.sh and as the authoritative repo list.
#
# Roles:
#   core    — the homeCore repo: server, crates, the Rust SDK, every Rust plugin
#   plugin  — a plugin that is NOT Rust, so not a member of that workspace
#   sdk     — plugin SDKs for other languages (Python, Node.js, .NET)
#   client  — UI and API consumers (web, TUI, MCP)
#
# The thirteen Rust plugin repos and hc-plugin-sdk-rs are NOT listed here any
# more. hc-matter is: it is TypeScript (matter.js), so it stays its own repo for
# the same reason hc-web and hc-mcp do.
# They live inside homeCore as workspace members — cloning core gets you all of
# them, at the revision that actually builds together. The old repos are
# archived read-only; their releases still serve the registry entries that point
# at them, so they are kept, not deleted. See core/docs/monorepo-plan.md.

[[repo]]
role   = "core"
name   = "homeCore"
path   = "core"
remote = "git@github.com:homeCore-io/homeCore.git"

[[repo]]
role   = "plugin"
name   = "hc-matter"
path   = "plugins/hc-matter"
remote = "git@github.com:homeCore-io/hc-matter.git"

# Every Python plugin, in one repo — the same shape core/plugins/ has for the
# Rust ones, and for the same reason: thirteen near-identical plugin repos each
# carrying a copy of one workflow is what the monorepo migration undid.
[[repo]]
role   = "plugin"
name   = "hc-plugins-py"
path   = "plugins-py"
remote = "git@github.com:homeCore-io/hc-plugins-py.git"

[[repo]]
role   = "sdk"
name   = "hc-plugin-sdk-py"
path   = "sdks/hc-plugin-sdk-py"
remote = "git@github.com:homeCore-io/hc-plugin-sdk-py.git"

