# Reusable release workflow for homeCore Rust components.
#
# Builds a statically linked x86_64-unknown-linux-musl binary, packages it into
# a tar.gz with config example + README + any extra files, sha-256 sidecar, and
# uploads as an Actions artifact. On a `v*` tag push, additionally creates a
# GitHub Release; optionally publishes a container image (core) or a signed
# registry artifact (plugins).
#
# `workflow_dispatch` triggers a build only — no Release is created.
# This is what lets you validate the whole pipeline before tagging.
#
# One component, one artifact. This workflow used to do considerably more:
# clone hc-web-leptos and compile it to WASM so hc-core could bake in a UI;
# assemble an "appliance" tarball merging core with every plugin's release;
# mirror a `latest` git tag purely so that assembly could download from it; and
# cascade to homeCore-io/docker to rebuild the appliance image. None of that
# describes the product any more — the UI is hc-web (its own image), and plugins
# install at runtime from the signed registry — so it is gone rather than left
# switched off.
#
# amd64 only, deliberately. The aarch64 matrix entry existed but had been
# hardcoded off with `true &&` overrides for long enough that no arm64 artifact
# has shipped in months, while the `fast` input still advertised a toggle that
# controlled nothing. Restoring multi-arch is a matter of re-adding the matrix
# entry and the QEMU steps; leaving a dead flag in place was the worse option.
#
# Caller example:
#   # core/.github/workflows/release.yml
#   name: Release
#   on:
#     push:
#       tags: ['v*']
#     workflow_dispatch:
#   jobs:
#     release:
#       uses: homeCore-io/hc-scripts/.github/workflows/rust-release.yml@main
#       with:
#         binary_name: homecore
#         config_example: config/homecore.toml.example
#         extra_files: |
#           config/profiles
#           rules/examples
#           scripts/service-templates/homecore.service

name: rust-release

# Opt JavaScript actions into Node.js 24 (default-on after 2026-06-02).
# Removes the deprecation banner from current runs.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  workflow_call:
    inputs:
      binary_name:
        description: 'Cargo binary target to build (also the archive prefix).'
        required: true
        type: string
      config_example:
        description: 'Path to config example file to include under config/ in the archive. Empty to skip.'
        required: false
        default: ''
        type: string
      extra_files:
        description: >-
          ACCEPTED AND IGNORED. It has never been wired to anything — nothing in
          this workflow reads it and build-archive.sh has no matching flag. Core
          passes `config/profiles` and the systemd unit through it and they do
          land in the archive, but because `stage_core` in build-archive.sh
          copies those two paths by name, not because this input asked for them.
          A caller adding a third path here would get silence.
          Kept only so existing callers keep parsing; add paths to
          build-archive.sh's stage_core instead. Remove once no caller passes it.
        required: false
        default: ''
        type: string
      rust_version:
        description: 'Rust toolchain version. Pinned default — bump
          deliberately rather than tracking "stable" so a new Rust major
          doesn''t silently change CI behavior. Was "stable" pre-2026-05-04
          when alpine + Rust pinning landed (BPF-2.2).'
        required: false
        default: "1.95"
        type: string
      # ─── Docker image publishing (opt-in) ────────────────────────────────
      publish_docker_image:
        description: 'Publish an image to ghcr.io after build. Caller release.yml must grant packages: write.'
        required: false
        default: false
        type: boolean
      image_name:
        description: 'ghcr.io image name (defaults to binary_name). Used when binary and image want different names, e.g. binary "homecore" -> image "hc-core".'
        required: false
        default: ''
        type: string
      dockerfile_name:
        description: >-
          Name of the Dockerfile to build. Looked up inside docker_context_dir
          in the calling repo when that is set, otherwise in homeCore-io/docker's
          images/ (where only Dockerfile.core exists — Dockerfile.plugin went
          away with the per-plugin images).
        required: false
        default: 'Dockerfile.core'
        type: string
      docker_context_dir:
        description: >-
          Directory in the CALLING repo holding the image recipe — the
          Dockerfile named by dockerfile_name plus anything it COPYs, such as an
          entrypoint. Everything in the directory is staged into the build
          context, so adding a helper script needs no change here.

          Set this and the recipe is versioned with the component it builds: the
          release tag alone reproduces the image, and there is no cross-repo
          tag to keep in step. Leave it empty for the legacy path, which fetches
          the recipe from homeCore-io/docker at docker_repo_ref and requires
          that repo to carry a matching tag.
        required: false
        default: ''
        type: string
      docker_repo_ref:
        description: >-
          Legacy path only — ignored when docker_context_dir is set. Branch/tag
          of homeCore-io/docker to fetch the Dockerfile + entrypoints from.
        required: false
        default: 'main'
        type: string
      publish_registry:
        description: >-
          Plugins only: on a tag release, repackage the binary as a tar.zst,
          attach it to the GitHub Release, notify the plugin registry, and then
          verify the entry actually reached the served index. REQUIRES the
          REGISTRY_DISPATCH_PAT secret — turning this on is a request to
          publish, so a release that cannot dispatch fails rather than passing
          with a warning.
        required: false
        default: false
        type: boolean
      registry_repo:
        description: 'owner/name of the registry repo to notify when publish_registry=true.'
        required: false
        default: 'homeCore-io/registry'
        type: string
      registry_index_url:
        description: >-
          Served index the release verifies itself against. This is the URL an
          hub actually fetches, not the repo file — publishing is only
          done when an operator could install the result.
        required: false
        default: 'https://homeCore-io.github.io/registry/index.json'
        type: string
      registry_verify_timeout_secs:
        description: >-
          How long to wait for the dispatched publish to land in the served
          index before failing the release. Sized for a whole-fleet tag, not a
          single one: publishes run concurrently but their Pages deploys
          serialize on the `pages` concurrency group, so the last plugin of ten
          waits out every deploy ahead of it. Tagging the fleet at once is
          precisely what exposed this gap, so the default must survive it.
        required: false
        default: 900
        type: number
      refresh_deps:
        description: >-
          Run `cargo update` for the in-org git deps (plugin-sdk-rs, hc-types,
          hc-logging, hc-time) before `cargo build`. Off by default so tag-push
          builds remain reproducible against the committed Cargo.lock. Turn on
          for SDK fanout dispatches so the rebuild actually carries the new
          SDK code instead of whatever SHA Cargo.lock currently pins.
        required: false
        default: false
        type: boolean

jobs:
  # ---------------------------------------------------------------------------
  # Build — runs on every workflow_dispatch and tag push.
  #
  # Still a matrix with one entry. Keeping the shape means restoring arm64 is
  # adding a line here plus the QEMU steps, rather than rediscovering how the
  # per-arch artifact names feed the Dockerfile's TARGETARCH selection.
  # ---------------------------------------------------------------------------
  build:
    name: ${{ matrix.platform }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            platform: linux-x86_64
            arch: amd64

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # On tag push, refuse to build if Cargo.toml's package version
      # doesn't match the tag. Catches the lockstep drift that produced
      # 0.1.1 binaries forever reporting "0.1.0" because env!(CARGO_PKG_VERSION)
      # bakes in whatever Cargo.toml said at build time. Skipped on
      # workflow_dispatch (no tag in flight). Mismatched tags will fail
      # at this step before any wasted compile work.
      - name: Verify Cargo.toml version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG_VERSION=$(grep -m1 -E '^version[[:space:]]*=' Cargo.toml | sed -E 's/version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/')
          if [ -z "$PKG_VERSION" ]; then
            echo "::error::Could not parse package version from Cargo.toml"
            exit 1
          fi
          if [ "$TAG" != "$PKG_VERSION" ]; then
            echo "::error::Tag v$TAG does not match Cargo.toml version $PKG_VERSION."
            echo "::error::Bump the [package] version in Cargo.toml to $TAG before tagging."
            exit 1
          fi
          echo "Tag v$TAG matches Cargo.toml version $PKG_VERSION ✓"

      # No QEMU: the only target is amd64 and the runner is amd64, so the
      # rust:alpine build container runs natively. Re-add
      # `docker/setup-qemu-action@v3` here if an arm64 matrix entry comes back —
      # without it the cross-arch `docker run --platform` below fails with
      # "exec format error".

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ matrix.target }}-

      - name: Build (${{ matrix.target }})
        run: |
          set -eux
          # Build inside rust:alpine for the target arch — same toolchain
          # as the published image, avoids host musl-gcc setup, and makes
          # x86_64 + aarch64 use the same code path.
          #
          # Map rust_version to the correct Docker tag:
          #   "stable"  → rust:alpine        (Docker has no rust:stable-alpine tag)
          #   "1.94"    → rust:1.94-alpine
          #   "nightly" → rust:nightly-alpine (works because that tag exists)
          if [ "${{ inputs.rust_version }}" = "stable" ]; then
              IMAGE="rust:alpine"
          else
              IMAGE="rust:${{ inputs.rust_version }}-alpine"
          fi
          # `refresh_deps` resolution strategy depends on the trigger:
          #
          # - **Tag push (release)**: pin each in-org git dep to the *latest
          #   SemVer tag's SHA* via `cargo update -p <pkg> --precise <sha>`.
          #   Released binaries get reproducibility against a stable Cargo.lock
          #   that points at real tag commits, not whatever `branch = "main"`
          #   happened to be at build time. Component versioning Phase D.
          #
          # - **workflow_dispatch (dev / SDK fanout)**: keep the legacy behavior
          #   — `cargo update -p <pkg>` resolves against branch HEAD per the
          #   plugin's Cargo.toml `branch = "main"` reference. SDK fanout
          #   relies on this so dev images carry the latest SDK code.
          #
          # - **refresh_deps=false (default)**: noop — committed Cargo.lock
          #   wins.
          #
          # Each `cargo update` is `|| true`-guarded because individual
          # callers may not depend on every in-org crate (e.g. hc-tui doesn't
          # use plugin-sdk-rs).
          REFRESH_CMD=":"
          if [ "${{ inputs.refresh_deps }}" = "true" ]; then
              if [ "${{ github.event_name }}" = "push" ] \
                  && [ "${GITHUB_REF#refs/tags/}" != "$GITHUB_REF" ]; then
                  echo "Tag-push release — pinning in-org git deps to latest tag SHAs"
                  CMD=""
                  for entry in \
                      "plugin-sdk-rs:homeCore-io/hc-plugin-sdk-rs" \
                      "hc-types:homeCore-io/homeCore" \
                      "hc-logging:homeCore-io/homeCore" \
                      "hc-time:homeCore-io/homeCore"; do
                      PKG="${entry%%:*}"
                      REPO="${entry##*:}"
                      # Latest SemVer-shaped tag (highest version), v-prefix tolerated.
                      TAG=$(gh api "/repos/${REPO}/git/refs/tags" \
                            --jq '.[] | .ref' 2>/dev/null \
                          | sed 's|refs/tags/||' \
                          | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' \
                          | sort -V \
                          | tail -1 \
                          || true)
                      if [ -n "$TAG" ]; then
                          SHA=$(gh api "/repos/${REPO}/git/refs/tags/${TAG}" \
                                --jq '.object.sha' 2>/dev/null || true)
                      else
                          SHA=""
                      fi
                      if [ -n "$SHA" ]; then
                          echo "  ${PKG} → ${REPO}@${TAG} (${SHA:0:7})"
                          CMD="${CMD}cargo update -p ${PKG} --precise ${SHA} || true; "
                      else
                          echo "  ${PKG} → ${REPO} has no SemVer tag yet; falling back to branch HEAD"
                          CMD="${CMD}cargo update -p ${PKG} || true; "
                      fi
                  done
                  REFRESH_CMD="$CMD"
              else
                  echo "workflow_dispatch — refreshing in-org deps against branch HEAD"
                  REFRESH_CMD='for p in plugin-sdk-rs hc-types hc-logging hc-time; do cargo update -p "$p" || true; done'
              fi
          fi
          docker run --rm \
            --platform linux/${{ matrix.arch }} \
            -v "$PWD:/src" \
            -v "$HOME/.cargo/registry:/usr/local/cargo/registry" \
            -w /src \
            -e REFRESH_CMD="$REFRESH_CMD" \
            "$IMAGE" \
            sh -c '
              apk add --no-cache musl-dev openssl-dev openssl-libs-static pkgconfig
              eval "$REFRESH_CMD"
              cargo build --release --bin ${{ inputs.binary_name }}
            '
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch hc-scripts (for build-archive.sh)
        uses: actions/checkout@v7
        with:
          repository: homeCore-io/hc-scripts
          ref: main
          path: .hc-scripts

      - name: Resolve version
        id: ver
        run: |
          VERSION="${GITHUB_REF_NAME}"
          # workflow_dispatch (any branch) → dev-<sha>; tag push (v*) → keep ref_name.
          if [[ "${GITHUB_REF}" != refs/tags/v* ]]; then
              VERSION="dev-$(git rev-parse --short HEAD)"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Assemble archive
        id: package
        run: |
          set -eux
          # The cargo build inside Docker writes target/release as root,
          # so the runner user can't mkdir under target/. Pass --bin
          # directly to build-archive.sh pointing at the Docker-built
          # path, sidestepping the ownership issue entirely.
          BIN_PATH="target/release/${{ inputs.binary_name }}"
          [ -f "$BIN_PATH" ] || { echo "::error::binary not found at $BIN_PATH"; exit 1; }

          # core: --kind core   (binary_name == homecore)
          # plugin: --kind plugin --name <binary_name>
          # everything else (e.g. hc-tui) packaged as a generic plugin
          # fragment so the per-archive shape stays uniform.
          if [ "${{ inputs.binary_name }}" = "homecore" ]; then
              KIND_ARGS="--kind core"
          else
              KIND_ARGS="--kind plugin --name ${{ inputs.binary_name }}"
          fi

          .hc-scripts/build-archive.sh \
              $KIND_ARGS \
              --target "${{ matrix.target }}" \
              --version "${{ steps.ver.outputs.version }}" \
              --source "$PWD" \
              --bin "$BIN_PATH" \
              --out dist

          # Capture the produced archive path for the upload step.
          archive=$(ls dist/*.tar.gz | head -1)
          echo "archive=${archive}" >> "$GITHUB_OUTPUT"
          echo "archive_basename=$(basename "$archive" .tar.gz)" >> "$GITHUB_OUTPUT"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Release — only on tag push. workflow_dispatch builds artifacts and stops.
  # ---------------------------------------------------------------------------
  release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.tar.gz.sha256

  # ---------------------------------------------------------------------------
  # Docker — opt-in. Builds an alpine image from the prebuilt musl binary and
  # pushes to ghcr.io/<owner>/<image_name>.
  #
  # Triggered on:
  #   - tag push  -> tag is github.ref_name (e.g. v0.1.0)
  #   - dispatch  -> tag is dev-<short_sha>  (lets us validate without tagging)
  # ---------------------------------------------------------------------------
  docker-publish:
    name: Publish Docker image
    needs: build
    runs-on: ubuntu-latest
    if: >-
      inputs.publish_docker_image == true &&
      (github.event_name == 'workflow_dispatch' ||
       github.event_name == 'repository_dispatch' ||
       (github.event_name == 'push' && (
         startsWith(github.ref, 'refs/tags/v') ||
         github.ref == 'refs/heads/develop'
       )))
    permissions:
      contents: read
      packages: write

    steps:
      - name: Resolve image name + tag(s)
        id: resolve
        run: |
          set -eux
          IMAGE_NAME="${{ inputs.image_name }}"
          [ -z "$IMAGE_NAME" ] && IMAGE_NAME="${{ inputs.binary_name }}"
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          BASE="ghcr.io/${OWNER}/${IMAGE_NAME}"
          # Tag pushes (refs/tags/v*) get a single immutable version tag.
          # Everything else — develop branch push, workflow_dispatch,
          # repository_dispatch — gets BOTH the immutable dev-<sha>
          # tag (for reproducibility) and the rolling :dev tag
          # (for "always pull newest dispatched"). main pushes don't
          # reach this job (gated above) since main is just a release-
          # marker FF target.
          if [ "${{ github.event_name }}" = "push" ] && [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
              # Strip the leading `v` from the git tag so image tags use the
              # bare version (`0.1.0`), matching the convention in
              # homeCore-io/docker compose files. The git tag itself stays as
              # `v0.1.0` (mirrored as the GitHub Release name).
              # Push BOTH the immutable version tag and the rolling :latest
              # tag, so a compose file can track stable without naming a
              # version while an operator who wants to pin still can.
              TAG="${GITHUB_REF_NAME#v}"
              TAGS=$(printf '%s\n%s' "${BASE}:${TAG}" "${BASE}:latest")
          else
              TAG="dev-${GITHUB_SHA::7}"
              TAGS=$(printf '%s\n%s' "${BASE}:${TAG}" "${BASE}:dev")
          fi
          {
              echo "image=${BASE}:${TAG}"
              echo "image_name=${IMAGE_NAME}"
              echo "tag=${TAG}"
              echo "tags<<EOTAGS"
              echo "${TAGS}"
              echo "EOTAGS"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout calling repo
        uses: actions/checkout@v7
        with:
          path: caller

      # Legacy path only. When the caller owns its recipe (docker_context_dir)
      # there is no second repo to fetch, no ref to keep in step, and nothing to
      # pre-flight — which is the point of that input.
      #
      # Otherwise the Dockerfile and entrypoints come from homeCore-io/docker at
      # this ref, so it is part of the recipe. Callers pin it to the release tag;
      # a missing tag means the release round tagged the component before
      # tagging homeCore-io/docker. actions/checkout would report only
      # "couldn't find remote ref", so say what actually needs doing.
      - name: Pre-flight — docker repo ref exists
        if: inputs.docker_context_dir == ''
        run: |
          set -eu
          REF='${{ inputs.docker_repo_ref }}'
          if ! git ls-remote --exit-code "https://github.com/homeCore-io/docker" "${REF}" >/dev/null 2>&1; then
            echo "::error::homeCore-io/docker has no ref '${REF}'. The Dockerfile and entrypoints for the published image are taken from that repo at this ref, so the release cannot proceed without it. If you are cutting a release, tag homeCore-io/docker with the same version *before* tagging this component."
            exit 1
          fi
          echo "docker recipe: homeCore-io/docker@${REF}"

      - name: Checkout homeCore-io/docker
        if: inputs.docker_context_dir == ''
        uses: actions/checkout@v7
        with:
          repository: homeCore-io/docker
          ref: ${{ inputs.docker_repo_ref }}
          path: docker-repo

      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Stage build context
        run: |
          set -eux
          mkdir -p build-context

          # Extract per-arch binaries from each platform's tar.gz and
          # rename to <binary>-<arch> for TARGETARCH selection in the
          # Dockerfile. Only amd64 is built today, but the loop is kept so
          # restoring arm64 needs a matrix entry and nothing here; it skips
          # platforms with no artifact rather than failing on tar.
          for plat in linux-x86_64 linux-aarch64; do
              if [ ! -d "artifacts/${plat}" ]; then
                  echo "::notice::skipping ${plat} (not built)"
                  continue
              fi
              tmpdir=$(mktemp -d)
              tar -xzf artifacts/${plat}/*.tar.gz -C "$tmpdir"
              BIN=$(find "$tmpdir" -type f -path "*/bin/${{ inputs.binary_name }}")
              case "$plat" in
                  linux-x86_64)  ARCH=amd64 ;;
                  linux-aarch64) ARCH=arm64 ;;
              esac
              cp "$BIN" "build-context/${{ inputs.binary_name }}-${ARCH}"
          done

          # Image recipe. Two sources:
          #
          #  docker_context_dir set — the recipe lives in the calling repo and is
          #  therefore versioned with the thing it builds. The whole directory is
          #  staged, so the Dockerfile's entrypoint and any helper it COPYs come
          #  along without this step naming them.
          #
          #  unset — legacy: fetched from homeCore-io/docker, which then has to
          #  carry a tag matching the component's.
          DOCKERFILE="${{ inputs.dockerfile_name }}"
          CTX_DIR="${{ inputs.docker_context_dir }}"

          if [ -n "$CTX_DIR" ]; then
              SRC="caller/${CTX_DIR}"
              if [ ! -d "$SRC" ]; then
                  echo "::error::docker_context_dir '${CTX_DIR}' not found in the calling repo."
                  exit 1
              fi
              if [ ! -f "${SRC}/${DOCKERFILE}" ]; then
                  echo "::error::dockerfile_name '${DOCKERFILE}' not found in '${CTX_DIR}'. Present: $(ls -A "$SRC" | tr '\n' ' ')"
                  exit 1
              fi
              cp -R "${SRC}/." build-context/
              # build-push-action is pointed at build-context/Dockerfile, so
              # normalise the name — unless it is already that, in which case
              # moving it onto itself would delete it.
              if [ "$DOCKERFILE" != "Dockerfile" ]; then
                  mv "build-context/${DOCKERFILE}" build-context/Dockerfile
              fi
              echo "docker recipe: ${GITHUB_REPOSITORY}@${GITHUB_SHA} (${CTX_DIR}/${DOCKERFILE})"
          else
              cp "docker-repo/images/${DOCKERFILE}" build-context/Dockerfile
              case "$DOCKERFILE" in
                  Dockerfile.core)
                      cp docker-repo/images/entrypoint-core.sh build-context/
                      ;;
                  *)
                      # Dockerfile.plugin used to be handled here. It and
                      # entrypoint-plugin.sh are gone: plugins ship as signed
                      # registry artifacts, not images, so hc-core is the only
                      # thing this workflow builds a container for.
                      echo "::error::Unknown dockerfile_name: $DOCKERFILE (homeCore-io/docker only provides Dockerfile.core)"
                      exit 1
                      ;;
              esac
          fi

          # config.toml.example from caller repo.
          if [ -n "${{ inputs.config_example }}" ] && \
             [ -f "caller/${{ inputs.config_example }}" ]; then
              cp "caller/${{ inputs.config_example }}" build-context/config.toml.example
          else
              # Required by the Dockerfile COPY; fail loudly rather than
              # producing an image with no defaults.
              echo "::error::config_example missing or not found: ${{ inputs.config_example }}"
              exit 1
          fi

          ls -la build-context

      # No QEMU — amd64-only on an amd64 runner needs no binfmt emulation.
      # Re-add `docker/setup-qemu-action@v3` (platforms: linux/amd64,linux/arm64)
      # if arm64 comes back, or buildx will fail on the foreign platform.

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: ./build-context
          file: ./build-context/Dockerfile
          platforms: linux/amd64
          build-args: |
            BINARY_NAME=${{ inputs.binary_name }}
          # Provenance in the image itself rather than inferred from a tag-name
          # convention. With docker_context_dir the recipe ships in this repo,
          # so `revision` identifies the Dockerfile and the source together —
          # which is the property the cross-repo tag lockstep was reaching for.
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.resolve.outputs.tag }}
          tags: ${{ steps.resolve.outputs.tags }}
          push: true

      - name: Image summary
        run: |
          {
            echo "Pushed:"
            echo '```'
            echo "${{ steps.resolve.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Registry publish — plugins only. Repackage the built binary as the tar.zst
  # the plugin registry serves (plugin.toml + binary — the exact format core's
  # installer unpacks), attach it to the GitHub Release, and notify the registry
  # to index it. This is how plugins are distributed now: signed registry
  # artifacts pulled at runtime, not container images.
  # ---------------------------------------------------------------------------
  registry-publish:
    name: Publish to plugin registry
    needs: [build, release]
    runs-on: ubuntu-latest
    if: >-
      always() &&
      needs.release.result == 'success' &&
      inputs.publish_registry == true &&
      github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Package tar.zst and attach to release
        id: pkg
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"          # v0.2.0
          VER="${TAG#v}"                          # 0.2.0
          BIN="${{ inputs.binary_name }}"         # hc-wled
          BARE="${BIN#hc-}"                       # wled
          ID="plugin.${BARE}"
          NAME="$(echo "$BARE" | sed 's/.*/\u&/')"   # Wled (cosmetic; UI humanizes the id)
          OS="linux"; ARCH="x86_64"; PLATFORM="${OS}-${ARCH}"

          # Pull the binary out of the release .tar.gz (homecore/plugins/<name>/<bin>).
          # Version-agnostic match: build-archive.sh names it <bin>-<TAG>-<platform>
          # (TAG keeps the leading v). `find -print -quit` returns 0 on no match
          # and never SIGPIPEs a piped head — both of which killed the old `ls`
          # under set -e/pipefail.
          GZ="$(find artifacts -type f -name "${BIN}-*-${PLATFORM}.tar.gz" -print -quit)"
          [ -n "$GZ" ] || { echo "::error::no ${BIN}-*-${PLATFORM}.tar.gz artifact found"; exit 1; }
          work="$(mktemp -d)"; tar -xzf "$GZ" -C "$work"
          binpath="$(find "$work" -type f -name "$BIN" -print -quit)"
          [ -n "$binpath" ] || { echo "::error::binary $BIN not in $GZ"; exit 1; }

          # Assemble plugin.<id>-<ver>-<platform>.tar.zst = plugin.toml + binary.
          stage="$(mktemp -d)"
          install -m755 "$binpath" "$stage/$BIN"
          printf 'id = "%s"\nname = "%s"\nversion = "%s"\nbinary = "%s"\n' \
            "$ID" "$NAME" "$VER" "$BIN" > "$stage/plugin.toml"
          ART="${ID}-${VER}-${PLATFORM}.tar.zst"
          tar --zstd -cf "$ART" -C "$stage" plugin.toml "$BIN"
          SHA="$(sha256sum "$ART" | cut -d' ' -f1)"
          SIZE="$(stat -c%s "$ART")"

          gh release upload "$TAG" "$ART" --clobber --repo "$GITHUB_REPOSITORY"

          {
            echo "id=$ID"; echo "name=$NAME"; echo "version=$VER"
            echo "os=$OS"; echo "arch=$ARCH"; echo "sha256=$SHA"; echo "size=$SIZE"
            echo "url=https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${ART}"
          } >> "$GITHUB_OUTPUT"

      - name: Notify registry to index it
        env:
          # Cross-repo dispatch needs a PAT with actions:write on the registry
          # repo; the per-repo GITHUB_TOKEN can't reach another repository.
          GH_TOKEN: ${{ secrets.REGISTRY_DISPATCH_PAT }}
        run: |
          set -euo pipefail
          # A missing secret used to warn and pass. That left the one way a
          # release could still report success while publishing nothing — the
          # same "green but not installable" failure this job now exists to
          # prevent, only quieter, and across every repo at once if the secret
          # were ever removed. publish_registry=true is a request to publish;
          # if that cannot happen, the release did not do what it was asked.
          #
          # An expired PAT already failed here, because `gh api` returns
          # non-zero under `set -e`. Absent now fails the same way.
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::REGISTRY_DISPATCH_PAT is not set, so ${{ inputs.registry_repo }} cannot be notified and this plugin will NOT be installable — but publish_registry is true, which asked for exactly that. The build and its release artifact are fine; only indexing is blocked."
            echo "Expected an org-level secret visible to this repo. Check with:"
            echo "  gh api /orgs/\${ORG}/actions/secrets --jq '.secrets[] | \"\\(.name) visibility=\\(.visibility)\"'   # needs admin:org"
            echo "Set it with:"
            echo "  gh secret set REGISTRY_DISPATCH_PAT --org \${ORG} --visibility all"
            echo "The PAT needs actions:write on ${{ inputs.registry_repo }}; the per-repo GITHUB_TOKEN cannot reach another repository."
            echo "To publish this build without re-running the release:"
            echo "  gh workflow run publish.yml --repo ${{ inputs.registry_repo }} -f id=${{ steps.pkg.outputs.id }} -f name='${{ steps.pkg.outputs.name }}' -f version=${{ steps.pkg.outputs.version }} -f os=${{ steps.pkg.outputs.os }} -f arch=${{ steps.pkg.outputs.arch }} -f url=${{ steps.pkg.outputs.url }} -f sha256=${{ steps.pkg.outputs.sha256 }} -f size=${{ steps.pkg.outputs.size }}"
            exit 1
          fi
          gh api "repos/${{ inputs.registry_repo }}/dispatches" \
            -f event_type=publish-plugin \
            -F "client_payload[id]=${{ steps.pkg.outputs.id }}" \
            -F "client_payload[name]=${{ steps.pkg.outputs.name }}" \
            -F "client_payload[version]=${{ steps.pkg.outputs.version }}" \
            -F "client_payload[os]=${{ steps.pkg.outputs.os }}" \
            -F "client_payload[arch]=${{ steps.pkg.outputs.arch }}" \
            -F "client_payload[url]=${{ steps.pkg.outputs.url }}" \
            -F "client_payload[sha256]=${{ steps.pkg.outputs.sha256 }}" \
            -F "client_payload[size]=${{ steps.pkg.outputs.size }}"
          echo "Notified ${{ inputs.registry_repo }}: ${{ steps.pkg.outputs.id }} ${{ steps.pkg.outputs.version }}"

      # Phase 6: make a release prove it published.
      #
      # Dispatching is not publishing. The step above ends at "notified" and
      # never looks at the outcome, which is exactly how ten green releases on
      # 2026-07-21 left six plugins missing from the index — four publish runs
      # cancelled, two rejected on push, and nothing anywhere reported a
      # problem. A release that cannot show its artifact in the index has not
      # finished, so this fails the job instead of leaving it to be noticed
      # weeks later.
      #
      # Polls the *served* index rather than the repo file: a hub
      # installs from Pages, so that is where "installable" becomes true. It
      # trails the commit by a deploy, which the timeout accounts for.
      - name: Verify it reached the registry index
        env:
          INDEX_URL: ${{ inputs.registry_index_url }}
          TIMEOUT_SECS: ${{ inputs.registry_verify_timeout_secs }}
          ID: ${{ steps.pkg.outputs.id }}
          NAME: ${{ steps.pkg.outputs.name }}
          VER: ${{ steps.pkg.outputs.version }}
          OS_: ${{ steps.pkg.outputs.os }}
          ARCH: ${{ steps.pkg.outputs.arch }}
          SHA: ${{ steps.pkg.outputs.sha256 }}
          REGISTRY_REPO: ${{ inputs.registry_repo }}
          URL: ${{ steps.pkg.outputs.url }}
          SIZE: ${{ steps.pkg.outputs.size }}
        run: |
          set -uo pipefail
          echo "Waiting for ${ID} ${VER} (${OS_}/${ARCH}) in ${INDEX_URL}"

          deadline=$(( SECONDS + TIMEOUT_SECS ))
          attempt=0
          seen_sha=""
          while :; do
            attempt=$(( attempt + 1 ))
            # Pages sits behind a CDN, so a plain GET can be served a copy from
            # before the deploy. Bust it per attempt, or this polls a cache and
            # times out against an index that already has the entry.
            body="$(curl -fsSL --max-time 30 \
                      -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' \
                      "${INDEX_URL}?cb=${GITHUB_RUN_ID}-${attempt}" 2>/dev/null)"

            if [ -n "${body:-}" ]; then
              # The entry for our exact coordinates, if the index has one.
              entry="$(printf '%s' "$body" | jq -c --arg id "$ID" --arg v "$VER" \
                        --arg os "$OS_" --arg arch "$ARCH" '
                          .plugins[]? | select(.id == $id)
                          | .versions[]? | select(.version == $v)
                          | .artifacts[]? | select(.os == $os and .arch == $arch)
                        ' 2>/dev/null | head -1)"

              if [ -n "${entry:-}" ]; then
                got="$(printf '%s' "$entry" | jq -r '.sha256 // ""')"
                if [ "$got" = "$SHA" ]; then
                  echo "Published and verified after ${attempt} attempt(s), $(( SECONDS ))s."
                  echo "  $entry"
                  exit 0
                fi
                # Present, but naming different bytes. Do NOT fail here: on a
                # re-run of an existing tag the index still holds the previous
                # build's artifact for these exact coordinates while this run's
                # publish is still in flight, and a musl rebuild is not
                # byte-identical. Failing on sight would call that a conflict
                # when waiting resolves it. Remember it and keep polling; if it
                # never converges the timeout below reports this rather than a
                # bare "never appeared", which would be the wrong diagnosis.
                if [ "$got" != "$seen_sha" ]; then
                  echo "  attempt ${attempt}: index has sha256 ${got}, waiting for ${SHA}"
                  seen_sha="$got"
                fi
              fi
            fi

            if [ "$SECONDS" -ge "$deadline" ]; then
              if [ -n "$seen_sha" ]; then
                echo "::error::${ID} ${VER} (${OS_}/${ARCH}) is in ${INDEX_URL} with sha256 ${seen_sha}, and did not become ${SHA} within ${TIMEOUT_SECS}s (${attempt} attempts). These coordinates already name different bytes, so this is not a missing publish — something else holds that (id, version, os, arch). Check both artifacts before overwriting either; re-publishing will replace what is there."
              else
                echo "::error::${ID} ${VER} (${OS_}/${ARCH}) never appeared in ${INDEX_URL} within ${TIMEOUT_SECS}s (${attempt} attempts). The release and its artifact are fine — indexing is what failed, so the plugin is NOT installable. Check the Publish runs at https://github.com/${REGISTRY_REPO}/actions, then re-publish by hand:"
              fi
              echo "  gh workflow run publish.yml --repo ${REGISTRY_REPO} -f id=${ID} -f name='${NAME}' -f version=${VER} -f os=${OS_} -f arch=${ARCH} -f url=${URL} -f sha256=${SHA} -f size=${SIZE}"
              exit 1
            fi

            sleep 20
          done
